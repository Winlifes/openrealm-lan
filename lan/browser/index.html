<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Winlife 魔兽争霸 III · 标准对战测试版</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; height: 100%; overscroll-behavior: none; }
  /* The engine adapts to whatever size the canvas is; fill the viewport so
     portrait phones render edge-to-edge (dvh handles mobile URL-bar chrome). */
  #game-container { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; background: #000; }
  #game-container.is-fullscreen { width: 100%; height: 100%; }
  #game-container:fullscreen { width: 100%; height: 100%; }
  #game-container:-webkit-full-screen { width: 100%; height: 100%; }
  #game-container:fullscreen::backdrop { background: #000; }
  canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  #game-chat-message { position: absolute; z-index: 22; top: 50%; left: 50%;
                       transform: translate(-50%, -50%); width: min(560px, 82vw);
                       box-sizing: border-box; padding: 8px 12px; color: #f5f0df;
                       background: #18150f; border: 1px solid #b89651; border-radius: 3px;
                       font: 16px/1.25 system-ui, sans-serif; }
  #status, #early-map-loading { position: absolute; inset: 0; z-index: 10; display: grid;
            place-content: center; text-align: center; color: #eee; background: #090b11;
            font: 15px/1.5 system-ui, sans-serif; pointer-events: none; }
  #status { gap: 12px; padding: 20px; }
  #status[hidden], #early-map-loading[hidden] { display: none; }
  #room-download-progress { justify-self: center; width: min(360px, 74vw); height: 12px; accent-color: #c8a765; }
  #resource-status { color: #bfc8d4; font-size: 12px; font-variant-numeric: tabular-nums; }
  #resource-status:empty { display: none; }
  #room-loading-actions { display: flex; justify-content: center; align-items: center; gap: 12px; }
  #room-loading-actions[hidden] { display: none; }
  #room-loading-actions a, #room-loading-actions button { pointer-events: auto; padding: 6px 12px;
            border: 1px solid #6a7484; border-radius: 4px; background: #1c2534;
            color: #eee; font: inherit; text-decoration: none; cursor: pointer; }
  #room-loading-actions a:hover, #room-loading-actions button:hover { background: #2b3a50; }
  #early-map-loading { gap: 14px; }
  #early-map-progress { width: min(360px, 74vw); height: 12px; accent-color: #c8a765; }
  #match-players { position: absolute; z-index: 11; bottom: 7%; left: 50%; transform: translateX(-50%);
                   width: min(430px, 90vw); box-sizing: border-box; padding: 12px 16px;
                   background: #18150f; color: #f5e6bc; border: 1px solid #b89651; border-radius: 4px;
                   font: 14px/1.5 system-ui, sans-serif; }
  #match-players header { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  #match-players a { color: inherit; flex: none; }
  #match-player-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 35vh; overflow: auto; }
  #match-player-list li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(50px, 1fr) 4em;
                          align-items: center; gap: 10px; padding: 2px 0; font-variant-numeric: tabular-nums; }
  #match-player-list li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #match-player-list progress { width: 100%; height: 8px; accent-color: #c8a765; }
  #match-player-list li span:last-child { text-align: right; }
  #game-controls { position: absolute; z-index: 40; top: 42px; right: 8px; display: flex; gap: 5px; }
  #game-controls button { height: 30px; padding: 0 8px; border: 1px solid rgba(220,230,245,.55);
            border-radius: 4px; background: rgba(0,0,0,.65); color: #fff; font: 12px/1 system-ui, sans-serif;
            cursor: pointer; touch-action: manipulation; }
  #game-controls button:hover, #game-controls button:focus-visible { background: rgba(50,75,105,.9); }
  .is-pointer-locked #game-controls { display: none; }
  #display-status { position: absolute; top: 42px; right: 8px; z-index: 41; margin: 0; pointer-events: none;
            color: #eee; background: rgba(0,0,0,.7); font: 12px/1.5 system-ui, sans-serif; }
  #display-status:not(:empty) { padding: 5px 8px; border-radius: 4px; }
  #input-status { position: absolute; left: 10px; bottom: 8px; right: 10px; color: #888;
                  font: 11px/1.4 monospace; text-shadow: 0 0 4px #000; pointer-events: none; }
  .touch-mode { -webkit-user-select: none; user-select: none; }
  #movie { display: none; position: absolute; inset: 0; width: 100%; height: 100%; z-index: 20;
           background: #000; object-fit: contain; }
  #movie-tap { display: none; position: absolute; inset: 0; z-index: 21; color: #ddd;
               font: 14px/1.6 monospace; text-align: center; padding-top: 45vh;
               background: rgba(0,0,0,.55); cursor: pointer; }
</style>
<div id="game-container">
  <canvas id="canvas" width="1280" height="720" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <input id="game-chat-message" type="text" aria-label="游戏聊天" placeholder="聊天"
         autocomplete="off" spellcheck="false" enterkeyhint="send" maxlength="199" hidden>
  <div id="status">
    <span id="status-message" role="status">正在准备客户端…</span>
    <progress id="room-download-progress" aria-label="进房资源下载进度"></progress>
    <span id="resource-status"></span>
    <div id="room-loading-actions" hidden>
      <button id="room-download-retry" type="button" hidden>重试</button>
      <a id="room-download-back">返回房间列表</a>
    </div>
  </div>
  <div id="early-map-loading" hidden>
    <span id="early-map-phase" role="status">正在载入对局…</span>
    <progress id="early-map-progress" max="1" aria-label="对局加载进度"></progress>
  </div>
  <section id="match-players" aria-labelledby="match-player-count" hidden>
    <header><strong id="match-player-count" role="status"></strong><a id="match-loading-back">返回大厅</a></header>
    <ul id="match-player-list"></ul>
  </section>
  <div id="game-controls">
    <button id="pointer-lock-button" type="button" title="按 Esc 释放鼠标" aria-pressed="false" hidden disabled>锁定鼠标</button>
    <button id="fullscreen-button" type="button" aria-pressed="false">全屏</button>
  </div>
  <p id="display-status" role="status"></p>
  <div id="input-status"></div>
  <video id="movie" playsinline preload="none"></video>
  <div id="movie-tap">▶ 点击播放</div>
</div>
<script src="fullscreen-resize.js"></script>
<script src="early-map-loading.js"></script>
<script src="wc3-room-assets.js"></script>
<script>
  window.__status = 'loading';
  window.__logs = [];
  window.__errors = [];
  const statusPanel = document.getElementById('status');
  const statusMessage = document.getElementById('status-message');
  const resourceStatus = document.getElementById('resource-status');
  const roomProgress = document.getElementById('room-download-progress');
  const roomActions = document.getElementById('room-loading-actions');
  const retry = document.getElementById('room-download-retry');
  var canvas = document.getElementById('canvas');
  const query = new URLSearchParams(location.search);
  const siteRoot = new URL('../../../', location.href);
  const sitePath = path => new URL(path, siteRoot).pathname;
  const createMap = query.get('create');
  const roomDraftKey = 'winlife-wc3-room-draft';
  let room = query.get('room');
  let roomPath = room !== null ? sitePath('api/rooms/' + room) : null;
  const isRoom = room !== null || createMap !== null;
  const back = document.getElementById('room-download-back');
  back.href = sitePath(isRoom ? 'rooms.html' : '');
  if (!isRoom) back.textContent = '返回首页';
  roomActions.hidden = !isRoom;
  retry.addEventListener('click', () => location.reload());
  let roomMap;
  let releaseFiles;
  let resourceBundle;
  let assetVersion;
  let loadFailed = false;
  const warmAssets = new Map();
  function setStatus(status) {
    if (loadFailed) return;
    window.__status = status;
    statusPanel.hidden = status === 'runtime-initialized';
    statusMessage.textContent = statusPanel.hidden ? '' : status;
  }
  function finishDownloadProgress() {
    roomProgress.hidden = true;
    resourceStatus.textContent = '';
  }
  function downloadProgress(sizes) {
    const total = [...sizes.values()].reduce((sum, size) => sum + size, 0);
    const received = new Map();
    let renderPending = false;
    const megabytes = bytes => (bytes / (1024 * 1024)).toFixed(1);
    roomProgress.max = total;
    roomProgress.value = 0;
    return (name, bytes) => {
      if (!sizes.has(name) || roomProgress.hidden) return;
      received.set(name, bytes);
      if (renderPending) return;
      renderPending = true;
      requestAnimationFrame(() => {
        renderPending = false;
        if (roomProgress.hidden) return;
        const loaded = [...received.values()].reduce((sum, size) => sum + size, 0);
        roomProgress.value = loaded;
        resourceStatus.textContent = megabytes(loaded) + ' / ' + megabytes(total) + ' MiB';
      });
    };
  }
  function mark(name) { performance.mark(name); }
  const presentMapLoading = window.openrealmEarlyMapLoading;
  const mapPhase = document.getElementById('early-map-phase');
  const matchPlayers = document.getElementById('match-players');
  const matchPlayerList = document.getElementById('match-player-list');
  const matchPlayerNames = new Map();
  let matchPlayerProgress;
  document.getElementById('match-loading-back').href = sitePath('rooms.html');
  function showMatchLoadingPlayers() {
    if (!isRoom || !loadingMatch || loadFailed || !matchPlayerProgress) return;
    const [ready,total,...players] = matchPlayerProgress;
    if (!total || players.length !== total * 2) return;
    document.getElementById('match-player-count').textContent = ready === total
      ? '所有玩家已就绪，即将开局' : `等待玩家加载 · ${ready} / ${total} 已就绪`;
    const rows = [];
    for (let i = 0; i < players.length; i += 2) {
      const player = players[i];
      const percent = players[i + 1];
      const name = matchPlayerNames.get(player) || `玩家 ${player + 1}`;
      const row = document.createElement('li');
      const label = document.createElement('span');
      label.textContent = name;
      label.title = name;
      const progress = document.createElement('progress');
      progress.max = 100;
      progress.value = percent;
      progress.setAttribute('aria-label', name + '的开局加载进度');
      const status = document.createElement('span');
      status.textContent = percent === 100 ? '已就绪' : `${percent}%`;
      row.append(label, progress, status);
      rows.push(row);
    }
    matchPlayerList.replaceChildren(...rows);
    matchPlayers.hidden = false;
  }
  window.openrealmMatchLoadingPlayers = state => {
    matchPlayerProgress = state.trim().split(/\s+/).map(Number);
    showMatchLoadingPlayers();
  };
  window.openrealmRoomPlayerName = (player, name) => {
    matchPlayerNames.set(player, name);
    showMatchLoadingPlayers();
  };
  let watchingRoom = isRoom;
  let loadingMatch = false;
  window.openrealmEarlyMapLoading = function (active, progress, submitted) {
    if (!active && !loadingMatch) return;
    if (active) {
      watchingRoom = false;
      mapPhase.textContent = progress >= 1 ? '正在进入对局…' : '正在载入对局…';
    } else {
      matchPlayers.hidden = true;
      matchPlayerProgress = null;
      wc3RoomAssets.retain(warmAssets);
    }
    if (active !== loadingMatch) {
      loadingMatch = active;
      mark(active ? 'wc3-match-loading' : 'wc3-match-ready');
    }
    if (active) showMatchLoadingPlayers();
    presentMapLoading?.(active, progress, submitted);
  };

  async function watchRoomStart() {
    if (!watchingRoom) return;
    try {
      const state = await readRoom();
      if (!watchingRoom) return;
      if (state?.status === 'playing') {
        watchingRoom = false;
        mapPhase.textContent = '服务器正在准备对局…';
        presentMapLoading?.(true, 0, false);
      }
    } catch (_) { /* Retry after transient network failures. */ }
    if (watchingRoom) setTimeout(watchRoomStart, 800);
  }

  async function readRoom() {
    const response = await fetch(roomPath, {cache:'no-store', signal:AbortSignal.timeout(8000)});
    if (!response.ok) throw new Error(response.status === 404
      ? '当前入口找不到该房间，请返回房间列表'
      : '联机服务暂时不可用，请返回房间列表重试');
    return response.json();
  }
  function readRoomForJoin() {
    return readRoom().catch(error => {
      if (error instanceof TypeError || error.name === 'TimeoutError')
        throw new Error('联机服务连接失败，请重试', {cause:error});
      throw error;
    });
  }
  function checkRoom(active, build) {
    if (active.build !== build) throw new Error('游戏版本已更新，请返回房间列表重新进入');
    if (active.status !== 'waiting') throw new Error(active.status === 'playing'
      ? '对局已经开始，请返回房间列表' : '房间暂时无法加入，请返回房间列表');
    if (active.players >= active.slots) throw new Error('房间已满，请返回房间列表');
    return active;
  }
  async function createPreparedRoom(draft) {
    setStatus('资源已就绪，正在创建房间…');
    const response = await fetch(sitePath('api/rooms'), {
      method:'POST', headers:{'Content-Type':'application/json'}, signal:AbortSignal.timeout(8000),
      body:JSON.stringify({mapId:draft.mapId, name:draft.name})
    }).catch(cause => { throw new Error('创建房间连接失败，请重试', {cause}); });
    let active = await response.json();
    if (!response.ok) throw new Error(active.error || '创建房间失败，请重试');
    room = active.id;
    roomPath = sitePath('api/rooms/' + room);
    const url = new URL(location.href);
    url.searchParams.delete('create');
    url.searchParams.set('room', room);
    url.searchParams.set('map', roomMap);
    history.replaceState(null, '', url);
    sessionStorage.removeItem(roomDraftKey);
    const deadline = performance.now() + 45000;
    while (active.status === 'starting' && performance.now() < deadline) {
      await new Promise(resolve => setTimeout(resolve, 350));
      active = await readRoomForJoin();
    }
    if (active.status === 'error') throw new Error(active.error || '服务器准备房间失败，请重试');
    return active;
  }
  async function readResource(url, read, {timeout = 30000, cache = 'default'} = {}) {
    const controller = new AbortController();
    let timer;
    const resetTimeout = () => {
      clearTimeout(timer);
      timer = setTimeout(() => controller.abort(), timeout);
    };
    resetTimeout();
    try {
      const response = await fetch(url, {cache, signal:controller.signal});
      if (!response.ok) throw new Error(url + ' HTTP ' + response.status);
      return await read(response, resetTimeout);
    } finally {
      clearTimeout(timer);
    }
  }
  async function fetchAsset(url, label, read, {fallback = url, timeout, onRetry} = {}) {
    try {
      return await readResource(url, read, {timeout});
    } catch (error) {
      console.warn('重新下载' + label, error);
      onRetry?.();
      try {
        return await readResource(fallback, read, {timeout, cache:'reload'});
      } catch (cause) {
        throw new Error(label + '下载失败，请重试', {cause});
      }
    }
  }
  function readStartupFile(url, label, file, progress, fallback = url) {
    return fetchAsset(url, label, (response, resetTimeout) => wc3RoomAssets.readBinary(response, file, bytes => {
      resetTimeout();
      progress?.(bytes);
    }), {fallback, onRetry: () => progress?.(0)});
  }
  function showLoadFailure(error) {
    if (loadFailed) return;
    console.error(error);
    const message = error?.message || '资源初始化失败，请重试';
    window.__errors.push(message);
    watchingRoom = false;
    matchPlayers.hidden = true;
    warmAssets.clear();
    finishDownloadProgress();
    presentMapLoading?.(false, 0, false);
    setStatus(message);
    roomActions.hidden = false;
    retry.hidden = false;
    loadFailed = true;
  }
  function dataUrl(path, version = window.__BUILD) {
    return Module.WC3_DATA_BASE + path.split('/').map(encodeURIComponent).join('/') +
      '?v=' + encodeURIComponent(version);
  }
  function pathList(text) { return text.split(/\r?\n/).map(line => line.trim()).filter(Boolean); }
  async function downloadLooseAsset(path, sidecars) {
    const sidecar = path + '.b64';
    const candidates = sidecars.has(path) ? [path, sidecar] : [path];
    if (path.endsWith('.blp')) candidates.push(path.slice(0, -4) + '.dds');
    for (const cache of ['default', 'reload']) {
      let failure;
      for (const name of candidates) {
        try {
          const response = await fetch(dataUrl(name), {cache, signal:AbortSignal.timeout(30000)});
          if (response.status === 404 || response.status === 410) continue;
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const bytes = name === sidecar
            ? Uint8Array.from(atob(await response.text()), byte => byte.charCodeAt(0))
            : new Uint8Array(await response.arrayBuffer());
          if (bytes.byteLength) return bytes;
          throw new Error('Empty response');
        } catch (error) {
          failure = error;
        }
      }
      if (!failure) return null;
      if (cache === 'reload') throw failure;
    }
  }
  function mountLooseAsset(diskPath, bytes) {
    if (!bytes?.byteLength) return 0;
    const separator = diskPath.lastIndexOf('/');
    if (separator > 0) Module.FS.mkdirTree(diskPath.slice(0, separator));
    Module.FS.writeFile(diskPath, bytes, {canOwn: true});
    return bytes.byteLength;
  }
  function fetchAssetForEngine(diskPath, filename) {
    const path = filename.replace(/\\/g, '/').replace(/^\/+/, '').toLowerCase();
    if (!Module.WC3_ASSET_INDEX.has(path)) return 0;
    const cached = warmAssets.get(path);
    const mountCached = bytes => {
      const size = mountLooseAsset(diskPath, bytes);
      if (size) warmAssets.delete(path);
      return size;
    };
    if (cached instanceof Uint8Array) return mountCached(cached);
    const fetchMissing = () => downloadLooseAsset(path, Module.WC3_B64_SET).then(bytes => {
      const size = mountLooseAsset(diskPath, bytes);
      if (size) console.debug('[fetch-on-demand] ' + path + ' (' + size + ' bytes)');
      return size;
    }).catch(error => {
      console.warn('读取对局资源失败', path, error.message);
      return 0;
    });
    if (!cached) return fetchMissing();
    const expanded = wc3RoomAssets.inflate(cached);
    if (expanded instanceof Uint8Array) return mountCached(expanded);
    return expanded.then(mountCached).catch(error => {
      console.warn('解压开局资源失败', path, error.message);
      return fetchMissing();
    });
  }
  async function preloadLooseAssets(paths, sidecars) {
    let next = 0, completed = 0, failure;
    async function download() {
      while (next < paths.length && !failure) {
        const path = paths[next++];
        try {
          const bytes = await downloadLooseAsset(path, sidecars);
          if (!bytes) throw new Error('Asset is missing');
          warmAssets.set(path, bytes);
          resourceStatus.textContent = '地图素材 ' + (++completed) + ' / ' + paths.length;
        } catch (cause) {
          failure = new Error('地图素材下载失败，请重试（' + path.split('/').pop() + '）', {cause});
        }
      }
    }
    await Promise.all(Array.from({length: Math.min(16, paths.length)}, download));
    if (failure) throw failure;
  }
  async function prepareBrowserResources(mapName) {
    mark('wc3-resources-start');
    setStatus(mapName ? '正在下载「' + mapName + '」的开局资源…' : '正在准备客户端和基础资源…');
    const sidecars = fetch(dataUrl('b64.index.txt'), {signal:AbortSignal.timeout(8000)}).then(async response => {
      if (response.status === 404) return '';
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.text();
    }).catch(error => { console.warn('资源编码目录不可用，使用原始文件', error); return ''; })
      .then(text => new Set(pathList(text.toLowerCase())));
    const readText = async (name, label) => new TextDecoder().decode(await readStartupFile(name, label, releaseFiles[name]));
    const [assets, maps, preloadText, mapIds] = await Promise.all([
      readText('assets.index.txt', '资源目录'),
      readText('playable-maps.index.txt', '可玩地图目录'),
      isRoom ? readText('preload.index.json', '开局资源目录') : null,
      createMap ? readText('room-maps.index.json', '房间地图目录').then(JSON.parse) : null
    ]);
    const paths = new Set(pathList(assets));
    const mapPaths = pathList(maps);
    if (createMap) roomMap = mapIds[createMap];
    if (isRoom && !mapPaths.includes(roomMap)) throw new Error('当前版本找不到房间地图，请返回房间列表');
    const plan = isRoom ? JSON.parse(preloadText) : null;
    const mapFiles = plan && Object.hasOwn(plan.maps, roomMap) ? plan.maps[roomMap] : [];
    const archive = plan?.archives?.[roomMap];
    const usePacks = plan?.packs && typeof DecompressionStream === 'function';
    const bundles = usePacks ? [
      [plan.packs.lobby, plan.lobby, '公共开局资源包'],
      [plan.packs.maps[roomMap], mapFiles, '地图开局资源包']
    ].filter(([, files]) => files.length) : [];
    const core = ['openwarcraft3.wasm', 'openwarcraft3.data', 'openwarcraft3.js', 'bootstrap.mpq'];
    const sizes = new Map([...core, ...bundles.map(([name]) => name)].map(name => [name, releaseFiles[name]?.bytes]));
    if (archive) sizes.set(roomMap, archive.bytes);
    const progress = downloadProgress(sizes);
    const download = (name, label, fallback) => readStartupFile(name, label, releaseFiles[name],
      bytes => progress(name, bytes), fallback);
    const selectedMap = async () => {
      if (!isRoom) return null;
      const url = dataUrl(roomMap, assetVersion);
      const bytes = archive ? await readStartupFile(url, '房间地图', archive, size => progress(roomMap, size)) :
        await fetchAsset(url, '房间地图', async response => {
          const data = new Uint8Array(await response.arrayBuffer());
          if (!data.byteLength) throw new Error('Empty map archive');
          return data;
        }, {timeout:90000});
      mark('wc3-room-map-ready');
      return bytes;
    };
    if (isRoom) mark('wc3-room-preload-start');
    const [bootstrap, engineModule, engineData, mapBytes, encodings] = await Promise.all([
      download('bootstrap.mpq', '基础资源包', 'bootstrap.mpq?local=1'),
      download('openwarcraft3.wasm', '客户端引擎', 'openwarcraft3.wasm?local=1')
        .then(bytes => WebAssembly.compile(bytes)),
      download('openwarcraft3.data', '客户端数据包', 'openwarcraft3.data?local=1'),
      selectedMap(),
      sidecars,
      download('openwarcraft3.js', '客户端脚本'),
      ...bundles.map(async ([name, files, label]) => {
        const bytes = await download(name, label, name + '?local=1');
        if (loadFailed) return;
        try {
          for (const [path, data] of wc3RoomAssets.unpack(bytes, files)) warmAssets.set(path, data);
        } catch (cause) {
          throw new Error(label + '校验失败，请重试', {cause});
        }
      })
    ]);
    if (plan && !usePacks) {
      finishDownloadProgress();
      await preloadLooseAssets([...new Set([...plan.lobby, ...mapFiles])], encodings);
    }
    if (isRoom) mark('wc3-room-preload-ready');
    return {paths, bootstrap, sidecars:encodings, mapPaths, mapBytes, engineModule, engineData:engineData.buffer};
  }

      const nickname = (localStorage.getItem('winlife-wc3-nickname') || '玩家').replace(/["\\+;\x00-\x1f]/g,' ').trim().slice(0,24);
      if (nickname) args.push('+set','name',nickname);

      if (isRoom) {

<script>
  async function boot() {
    if ((room !== null && !/^[a-f0-9]{18}$/.test(room)) ||
        (createMap !== null && (room !== null || !/^[a-f0-9]{16}$/.test(createMap))))
      throw new Error('房间链接无效，请返回房间列表');
    const draft = createMap ? JSON.parse(sessionStorage.getItem(roomDraftKey)) : null;
    if (createMap && draft?.mapId !== createMap) throw new Error('请从房间列表创建房间');
    const version = fetchAsset('version.json', '客户端版本', response => response.json());
    const [active, release, files] = await Promise.all([
      room ? Promise.all([readRoomForJoin(), version]).then(([state, {build}]) => checkRoom(state, build)) : null,
      version,
      fetchAsset('release-manifest.json', '发布文件清单', response => response.json())
    ]);
    window.__BUILD = release.build;
    assetVersion = release.release || release.build;
    releaseFiles = files;
    Module.WC3_DATA_V = encodeURIComponent(release.build);
    if (active) roomMap = new URL(active.url, location.origin).searchParams.get('map');
    let {engineModule, engineData, ...prepared} = await prepareBrowserResources(active?.map || draft?.mapName);
    finishDownloadProgress();
    if (isRoom) {
      const ready = checkRoom(createMap ? await createPreparedRoom(draft) : await readRoomForJoin(), release.build);
      if (new URL(ready.url, location.origin).searchParams.get('map') !== roomMap)
        throw new Error('房间地图已变更，请返回房间列表重新进入');
      setStatus('资源已就绪，正在连接房间…');
      const socket = location.origin.replace(/^http/, 'ws') + roomPath + '/ws?build=' + Module.WC3_DATA_V;
      Module.arguments.push('+ws_url', socket, '+set', 'connect', '127.0.0.1');
    } else setStatus('正在初始化游戏…');
    resourceBundle = prepared;
    Module.instantiateWasm = (imports, receive) => {
      const module = engineModule;
      engineModule = null;
      WebAssembly.instantiate(module, imports).then(instance => receive(instance, module)).catch(cause => {
        showLoadFailure(new Error('客户端引擎初始化失败，请重试', {cause}));
      });
    };
    Module.getPreloadedPackage = () => {
      const data = engineData;
      engineData = null;
      return data;
    };
    const scriptHash = releaseFiles['openwarcraft3.js'].sha256;
    const scriptIntegrity = 'sha256-' + btoa(scriptHash.match(/../g).map(hex => String.fromCharCode(parseInt(hex, 16))).join(''));
    const loadScript = retried => {
      const script = document.createElement('script');
      script.src = retried ? 'openwarcraft3.js?retry=1' : 'openwarcraft3.js';
      script.integrity = scriptIntegrity;
      script.onerror = () => {
        script.remove();
        if (retried) showLoadFailure(new Error('客户端脚本加载失败，请重试'));
        else loadScript(true);
      };
      document.head.appendChild(script);
    };
    loadScript(false);
  }
  boot().catch(showLoadFailure);
</script>
