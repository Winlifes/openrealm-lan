<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Winlife 魔兽争霸 III · 标准对战测试版</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; height: 100%; overscroll-behavior: none; }
  /* The engine adapts to whatever size the canvas is; fill the viewport so
     portrait phones render edge-to-edge (dvh handles mobile URL-bar chrome). */
  #game-container { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; background: #000; }
  #game-container.is-fullscreen { width: 100%; height: 100%; }
  #game-container:fullscreen { width: 100%; height: 100%; }
  #game-container:-webkit-full-screen { width: 100%; height: 100%; }
  #game-container:fullscreen::backdrop { background: #000; }
  canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  #status, #early-map-loading { position: absolute; inset: 0; z-index: 10; display: grid;
            place-content: center; text-align: center; color: #eee; background: #090b11;
            font: 15px/1.5 system-ui, sans-serif; pointer-events: none; }
  #status[hidden], #early-map-loading[hidden] { display: none; }
  #early-map-loading { gap: 14px; }
  #early-map-progress { width: min(360px, 74vw); height: 12px; accent-color: #c8a765; }
  #resource-status { position: absolute; z-index: 11; top: calc(50% + 22px); inset-inline: 0;
            color: #bfc8d4; text-align: center; font: 12px/1.5 system-ui, sans-serif; pointer-events: none; }
  #game-controls { position: absolute; z-index: 40; top: 42px; right: 8px; display: flex; gap: 5px; }
  #game-controls button { height: 30px; padding: 0 8px; border: 1px solid rgba(220,230,245,.55);
            border-radius: 4px; background: rgba(0,0,0,.65); color: #fff; font: 12px/1 system-ui, sans-serif;
            cursor: pointer; touch-action: manipulation; }
  #game-controls button:hover, #game-controls button:focus-visible { background: rgba(50,75,105,.9); }
  .is-pointer-locked #game-controls { display: none; }
  #display-status { position: absolute; top: 42px; right: 8px; z-index: 41; margin: 0; pointer-events: none;
            color: #eee; background: rgba(0,0,0,.7); font: 12px/1.5 system-ui, sans-serif; }
  #display-status:not(:empty) { padding: 5px 8px; border-radius: 4px; }
  #input-status { position: absolute; left: 10px; bottom: 8px; right: 10px; color: #888;
                  font: 11px/1.4 monospace; text-shadow: 0 0 4px #000; pointer-events: none; }
  .touch-mode { -webkit-user-select: none; user-select: none; }
  #movie { display: none; position: absolute; inset: 0; width: 100%; height: 100%; z-index: 20;
           background: #000; object-fit: contain; }
  #movie-tap { display: none; position: absolute; inset: 0; z-index: 21; color: #ddd;
               font: 14px/1.6 monospace; text-align: center; padding-top: 45vh;
               background: rgba(0,0,0,.55); cursor: pointer; }
</style>
<div id="game-container">
  <canvas id="canvas" width="1280" height="720" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="status" role="status">正在准备客户端…</div>
  <div id="resource-status"></div>
  <div id="early-map-loading" hidden>
    <span id="early-map-phase" role="status">正在载入对局…</span>
    <progress id="early-map-progress" max="1" aria-label="对局加载进度"></progress>
  </div>
  <div id="game-controls">
    <button id="pointer-lock-button" type="button" title="按 Esc 释放鼠标" aria-pressed="false" hidden disabled>锁定鼠标</button>
    <button id="fullscreen-button" type="button" aria-pressed="false">全屏</button>
  </div>
  <p id="display-status" role="status"></p>
  <div id="input-status"></div>
  <video id="movie" playsinline preload="none"></video>
  <div id="movie-tap">▶ 点击播放</div>
</div>
<script src="fullscreen-resize.js"></script>
<script src="early-map-loading.js"></script>
<script>
  window.__status = 'loading';
  window.__logs = [];
  window.__errors = [];
  var st = document.getElementById('status');
  var resourceStatus = document.getElementById('resource-status');
  var canvas = document.getElementById('canvas');
  const query = new URLSearchParams(location.search);
  const siteRoot = new URL('../../../', location.href);
  const sitePath = path => new URL(path, siteRoot).pathname;
  const room = query.get('room');
  const isRoom = /^[a-f0-9]{18}$/.test(room || '');
  const roomPath = sitePath('api/rooms/' + room);
  let roomMap;
  let releaseFiles;
  let resourceBundle;
  let matchPreload;
  let matchReady = false;
  let loadFailed = false;
  const warmAssets = new Map();
  function setStatus(status) {
    if (loadFailed) return;
    window.__status = status;
    st.hidden = status === 'runtime-initialized';
    st.textContent = st.hidden ? '' : status;
  }
  function mark(name) { performance.mark(name); }
  const presentMapLoading = window.openrealmEarlyMapLoading;
  const mapPhase = document.getElementById('early-map-phase');
  let watchingRoom = isRoom;
  let loadingMatch = false;
  window.openrealmEarlyMapLoading = function (active, progress, submitted) {
    if (!active && !loadingMatch) return;
    if (active) {
      watchingRoom = false;
      mapPhase.textContent = progress >= 1 ? '正在进入对局…' : '正在载入对局…';
    } else {
      matchReady = true;
      warmAssets.clear();
    }
    if (active !== loadingMatch) {
      loadingMatch = active;
      mark(active ? 'wc3-match-loading' : 'wc3-match-ready');
    }
    presentMapLoading?.(active, progress, submitted);
  };

  async function watchRoomStart() {
    if (!watchingRoom) return;
    try {
      const state = await readRoom();
      if (!watchingRoom) return;
      if (state?.status === 'playing') {
        watchingRoom = false;
        mapPhase.textContent = '服务器正在准备对局…';
        presentMapLoading?.(true, 0, false);
      }
    } catch (_) { /* Retry after transient network failures. */ }
    if (watchingRoom) setTimeout(watchRoomStart, 800);
  }

  async function readRoom() {
    const response = await fetch(roomPath, {cache:'no-store', signal:AbortSignal.timeout(8000)});
    if (!response.ok) throw new Error(response.status === 404
      ? '当前入口找不到该房间，请返回房间列表'
      : '联机服务暂时不可用，请返回房间列表重试');
    return response.json();
  }
  async function readResource(url, read, {timeout = 30000, cache = 'default'} = {}) {
    const response = await fetch(url, {cache, signal:AbortSignal.timeout(timeout)});
    if (!response.ok) throw new Error(url + ' HTTP ' + response.status);
    return read(response);
  }
  async function fetchAsset(url, label, read, fallback = url) {
    try {
      return await readResource(url, read);
    } catch (error) {
      console.warn('重新下载' + label, error);
      try {
        return await readResource(fallback, read, {cache:'reload'});
      } catch (cause) {
        throw new Error(label + '加载失败，请刷新重试', {cause});
      }
    }
  }
  async function readBinary(response, name) {
    const bytes = await response.arrayBuffer();
    if (bytes.byteLength !== releaseFiles[name]?.bytes) throw new Error(name + ' 文件大小不符');
    return bytes;
  }
  function showLoadFailure(error) {
    if (loadFailed) return;
    console.error(error);
    const message = error?.message || '资源初始化失败，请刷新重试';
    window.__errors.push(message);
    watchingRoom = false;
    resourceStatus.textContent = '';
    presentMapLoading?.(false, 0, false);
    setStatus(message);
    loadFailed = true;
  }
  function dataUrl(path) {
    return Module.WC3_DATA_BASE + path.split('/').map(encodeURIComponent).join('/') +
      '?v=' + encodeURIComponent(window.__BUILD);
  }
  function pathList(text) { return text.split(/\r?\n/).map(line => line.trim()).filter(Boolean); }
  async function downloadLooseAsset(path, sidecars) {
    const sidecar = path + '.b64';
    const candidates = sidecars.has(path) ? [sidecar, path] : [path];
    if (path.endsWith('.blp')) candidates.push(path.slice(0, -4) + '.dds');
    for (const name of candidates) {
      const response = await fetch(dataUrl(name), {signal: AbortSignal.timeout(30000)});
      if (!response.ok) continue;
      return name === sidecar
        ? Uint8Array.from(atob(await response.text()), byte => byte.charCodeAt(0))
        : new Uint8Array(await response.arrayBuffer());
    }
    return null;
  }
  function mountLooseAsset(diskPath, bytes) {
    if (!bytes?.byteLength) return 0;
    const separator = diskPath.lastIndexOf('/');
    if (separator > 0) Module.FS.mkdirTree(diskPath.slice(0, separator));
    Module.FS.writeFile(diskPath, bytes, {canOwn: true});
    return bytes.byteLength;
  }
  function fetchAssetForEngine(diskPath, filename) {
    const path = filename.replace(/\\/g, '/').replace(/^\/+/, '').toLowerCase();
    if (!Module.WC3_ASSET_INDEX.has(path)) return 0;
    const cached = warmAssets.get(path);
    if (cached) return mountLooseAsset(diskPath, cached);
    const fetchMissing = () => downloadLooseAsset(path, Module.WC3_B64_SET).then(bytes => {
      const size = mountLooseAsset(diskPath, bytes);
      if (size) console.debug('[fetch-on-demand] ' + path + ' (' + size + ' bytes)');
      return size;
    }).catch(error => {
      console.warn('读取对局资源失败', path, error.message);
      return 0;
    });
    if (loadingMatch && matchPreload) {
      return matchPreload.then(() => {
        const prepared = warmAssets.get(path);
        return prepared ? mountLooseAsset(diskPath, prepared) : fetchMissing();
      });
    }
    return fetchMissing();
  }
  async function loadMaps() {
    const paths = await fetchAsset('playable-maps.index.txt', '可玩地图目录', async response => pathList(await response.text()));
    if (!isRoom) return {paths};
    if (!paths.includes(roomMap)) throw new Error('当前版本找不到房间地图，请返回房间列表');
    const bytes = await fetchAsset(dataUrl(roomMap), '房间地图', async response => new Uint8Array(await response.arrayBuffer()));
    mark('wc3-room-map-ready');
    return {paths, selected:roomMap, bytes};
  }
  async function preloadRoomAssets(paths, b64) {
    if (!isRoom) return;
    const plan = await readResource('preload.index.json', response => response.json(), {timeout:8000});
    const served = new Set(paths);
    const sidecars = new Set(b64);
    const lobby = new Set(plan.lobby.filter(path => served.has(path)));
    const mapFiles = Object.hasOwn(plan.maps, roomMap) ? plan.maps[roomMap] : [];
    const matchFiles = [...new Set(mapFiles)].filter(path => served.has(path) && !lobby.has(path));
    mark('wc3-room-preload-start');
    async function downloadGroup(files, onProgress) {
      let next = 0, completed = 0;
      async function download() {
        while (next < files.length && !matchReady) {
          const path = files[next++];
          try {
            const bytes = await downloadLooseAsset(path, sidecars);
            if (!matchReady && bytes?.byteLength) warmAssets.set(path, bytes);
          } catch (_) { /* The engine can retry on demand. */ }
          completed++;
          if (completed % 10 === 0 || completed === files.length) onProgress(completed, files.length);
        }
      }
      await Promise.all(Array.from({length: Math.min(24, files.length)}, download));
    }
    await downloadGroup([...lobby], (loaded, total) => {
      resourceStatus.textContent = '大厅素材 ' + loaded + ' / ' + total;
    });
    // Admit the browser to the lobby as soon as the shared assets are ready.
    // Continue the selected map's preload while players are setting up the room.
    matchPreload = downloadGroup(matchFiles, (loaded, total) => {
      if (loadingMatch) mapPhase.textContent = '正在下载地图素材 ' + loaded + ' / ' + total;
    }).then(() => {
      matchPreload = null;
      mark('wc3-room-preload-ready');
    });
  }
  async function prefetchBrowserResources() {
    mark('wc3-resources-start');
    setStatus(isRoom ? '正在准备客户端和对局资源…' : '正在准备客户端和基础资源…');
    const b64 = fetch(dataUrl('b64.index.txt'), {signal:AbortSignal.timeout(8000)}).then(response => {
      if (response.status === 404) return '';
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.text();
    }).catch(error => { console.warn('资源编码目录不可用，使用原始文件', error); return ''; });
    const [index, sidecars, bootstrap, maps] = await Promise.all([
      fetchAsset('assets.index.txt', '资源目录', response => response.text()),
      b64,
      fetchAsset('bootstrap.mpq', '基础资源包', response => readBinary(response, 'bootstrap.mpq'), 'bootstrap.mpq?local=1'),
      loadMaps()
    ]);
    return {paths:pathList(index), bootstrap:new Uint8Array(bootstrap), sidecars:pathList(sidecars.toLowerCase()), maps};
  }
  window.addEventListener('error', function (e) { window.__errors.push(String(e.message)); });
  var Module = {
    canvas: canvas,
    preRun: [function () {
      Module.FS.mkdirTree('/data');
      Module.ENV.XDG_DATA_HOME = '/userdata';
      if (query.get('audio') === 'dummy') Module.ENV.SDL_AUDIODRIVER = 'dummy';
      Module.addRunDependency('game-resources');
      const movies = loadMovieCatalog().catch(error => console.warn('跳过过场视频目录', error));
      Promise.all([loadBrowserResources(), loadPlayerFiles(), !isRoom && movies])
        .then(function () {
          // Removing the final dependency starts main synchronously. A renderer
          // exception here is an engine startup error, not a failed download.
          try { Module.removeRunDependency('game-resources'); }
          catch (cause) { showLoadFailure(new Error('游戏启动失败，请刷新重试', {cause})); }
        }).catch(showLoadFailure);
    }],
    arguments: ['-data', '/data', '+com_maxfps', '60', '+fs_expansion', '1', '+vid_native', '0', '+vid_fullscreen', '0', '+vid_mode', '4',
      '+set', 'wc3_locale', 'zhCN', '+set', 'cl_camera_edge_margin', '12', '+set', 'scr_showfps', '1'].concat((() => {
      // A validated room id selects the site's same-origin multiplayer route.
      let args = [];
      const nickname = (localStorage.getItem('winlife-wc3-nickname') || '玩家').replace(/["\\+;\x00-\x1f]/g,' ').trim().slice(0,24);
      if (nickname) args.push('+set','name',nickname);
      if (isRoom) {
        const socketOrigin = location.origin.replace(/^http/, 'ws');
        args.push('+ws_url',socketOrigin + roomPath + '/ws','+set','connect','127.0.0.1');
      }
      if (query.get('debug') === '1') args.push('+set','cl_ui_hit_debug','1');
      return args;
    })()),
    print: function (t) { if (window.__logs.length < 2000) window.__logs.push(String(t)); },
    printErr: function (t) { console.error(t); window.__errors.push(String(t)); if (window.__errors.length > 4000) window.__errors.shift(); },
    WC3_DATA_BASE: sitePath('play/gamedata/'),
    WC3_FetchAsset: fetchAssetForEngine,
    onSessionEnded: function () { finishBrowserSession(); },
    onExit: function () { finishBrowserSession(); },
    onRuntimeInitialized: function () {
      mark('wc3-runtime-ready');
      setStatus('runtime-initialized');
      document.getElementById('pointer-lock-button').disabled = false;
      void watchRoomStart();
    },
    locateFile: function (f) { return f + '?v=' + window.__BUILD; },
    onAbort: function (why) {
      window.__errors.push('ABORT: ' + why);
      watchingRoom = false;
      presentMapLoading?.(false, 0, false);
      setStatus('游戏加载失败，请返回房间重试');
    },
    wc3PlayMovie: function (path) {
      var name=String(path).replace(/\\/g,'/').split('/').pop().replace(/\.(mpq|avi|mp4|bik|webm)$/i,'').toLowerCase();
      if (Module.WC3_MOVIES && Module.WC3_MOVIES.has(name)) {
        if (window.__moviePlay) window.__moviePlay(String(path));
      } else {
        window.__logs.push('Optional movie is not installed: '+path);
        // The completion can start the next logo. Deliver it after CL_PlayMovie
        // returns, so a nested request cannot leave the engine's movie gate set.
        setTimeout(function () { if(Module._WC3_MovieDone)Module._WC3_MovieDone(); },0);
      }
    },
  };
  window.Module = Module;
  var returningToSite = false;
  function finishBrowserSession() {
    if (returningToSite) return;
    returningToSite = true;
    watchingRoom = false;
    presentMapLoading?.(false, 0, false);
    setStatus('正在保存进度并返回…');
    var leave = function (error) {
      if (error) {
        returningToSite = false;
        window.__errors.push('保存进度失败: ' + error);
        setStatus('进度保存失败，请稍后重试退出');
        return;
      }
      location.assign(sitePath(isRoom ? 'rooms.html' : ''));
    };
    if (Module.FS && Module.FS.syncfs) Module.FS.syncfs(false, leave);
    else leave();
  }
  window.loadPlayerFiles = function () {
    return new Promise(function (resolve, reject) {
      Module.FS.mkdirTree('/userdata');
      // Multiplayer has no saved-game UI. Keep its temporary files out of the
      // single-player IDBFS store: syncing an older tab's tree would delete
      // saves created by another tab after it started (IDBFS reconcile semantics).
      if (isRoom) {
        resolve();
        return;
      }
      Module.FS.mount(Module.FS.filesystems.IDBFS, {autoPersist:true}, '/userdata');
      Module.FS.syncfs(true, function (error) { if(error)reject(error);else resolve(); });
    });
  };
  async function loadBrowserResources() {
    const {paths, bootstrap, sidecars, maps} = await resourceBundle;
    resourceBundle = null;
    Module.WC3_ASSET_INDEX = new Set(paths);
    Module.WC3_B64_SET = new Set(sidecars);
    const fs = Module.FS;
    fs.writeFile('/data/startup.mpq', bootstrap, {canOwn:true});
    // Other maps need only a directory entry until the engine opens them.
    for (const name of maps.paths) {
      const path = '/data/' + name.replace(/^maps\//i, 'Maps/');
      fs.mkdirTree(path.slice(0, path.lastIndexOf('/')));
      fs.writeFile(path, name === maps.selected ? maps.bytes : new Uint8Array(0), {canOwn:true});
    }
    await preloadRoomAssets(paths, sidecars).catch(error => window.__errors.push('预载目录: ' + error.message));
    window.__mapCatalog = maps.paths.length;
    resourceStatus.textContent = '';
    mark('wc3-resources-mounted');
    setStatus('正在初始化游戏…');
  }
</script>
<script src="wc3-movies.js"></script>
<script src="wc3-input.js"></script>
<script>
  async function boot() {
    if (room !== null && !isRoom) throw new Error('房间链接无效，请返回房间列表');
    const roomState = isRoom ? readRoom().catch(error => {
      if (error instanceof TypeError || error.name === 'TimeoutError')
        throw new Error('联机服务暂时不可用，请返回房间列表重试', {cause:error});
      throw error;
    }) : null;
    const [active, release, files] = await Promise.all([
      roomState,
      fetchAsset('version.json', '客户端版本', response => response.json()),
      fetchAsset('release-manifest.json', '发布文件清单', response => response.json())
    ]);
    window.__BUILD = release.build;
    releaseFiles = files;
    Module.WC3_DATA_V = encodeURIComponent(release.build);
    if (isRoom) {
      if (active.build !== release.build)
        throw new Error('游戏版本已更新，请返回房间列表重新进入');
      if (active.status !== 'waiting') throw new Error(active.status === 'playing'
        ? '对局已经开始，请返回房间列表' : '房间暂时无法加入，请返回房间列表');
      roomMap = new URL(active.url, location.origin).searchParams.get('map');
      Module.arguments[Module.arguments.indexOf('+ws_url') + 1] += '?build=' + Module.WC3_DATA_V;
    }
    resourceBundle = prefetchBrowserResources();
    resourceBundle.catch(showLoadFailure);
    let [engineModule, engineData] = await Promise.all([
      fetchAsset('openwarcraft3.wasm', '客户端引擎', async response =>
        WebAssembly.compile(await readBinary(response, 'openwarcraft3.wasm')), 'openwarcraft3.wasm?local=1'),
      fetchAsset('openwarcraft3.data', '客户端数据包',
        response => readBinary(response, 'openwarcraft3.data'), 'openwarcraft3.data?local=1')
    ]);
    if (loadFailed) return;
    Module.instantiateWasm = (imports, receive) => {
      const module = engineModule;
      engineModule = null;
      WebAssembly.instantiate(module, imports).then(instance => receive(instance, module)).catch(cause => {
        showLoadFailure(new Error('客户端引擎初始化失败，请刷新重试', {cause}));
      });
    };
    Module.getPreloadedPackage = () => {
      const data = engineData;
      engineData = null;
      return data;
    };
    const loadScript = retry => {
      const script = document.createElement('script');
      script.src = retry ? 'openwarcraft3.js?retry=1' : 'openwarcraft3.js';
      script.onerror = () => {
        script.remove();
        if (retry) showLoadFailure(new Error('客户端脚本加载失败，请刷新重试'));
        else loadScript(true);
      };
      document.head.appendChild(script);
    };
    loadScript(false);
  }
  boot().catch(showLoadFailure);
</script>
