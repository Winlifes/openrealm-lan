<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Winlife 魔兽争霸 III · 联机大厅</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="rooms.css">
  <script src="rooms.js" defer></script>
</head>
<body class="room-page">
  <header class="topbar">
    <a class="brand" href="./"><span class="mark" aria-hidden="true">W</span><span>WINLIFE<small>魔兽争霸 III</small></span></a>
    <a class="back" href="./">返回首页</a>
  </header>
  <main class="room-main">
    <div class="room-intro">
      <h1>联机大厅</h1>
      <div class="release-controls">
        <span id="current-release">正在读取版本</span>
        <button id="show-release-notes" class="secondary" type="button" aria-haspopup="dialog">更新日志</button>
      </div>
    </div>
    <aside id="release-update" class="release-update" hidden>
      <p id="release-update-text" role="status"></p>
      <button id="reload-release" type="button">刷新到新版</button>
    </aside>
    <div class="room-grid">
      <section class="room-panel" aria-labelledby="create-heading">
        <div class="room-heading"><h2 id="create-heading">创建房间</h2></div>
        <form id="create-room" class="room-panel-body">
          <label for="nickname">你的昵称</label>
          <input id="nickname" required maxlength="24" autocomplete="nickname" placeholder="输入昵称">
          <label for="room-name">房间名称</label>
          <input id="room-name" maxlength="40" placeholder="朋友们的对局">
          <label for="map-search">查找地图</label>
          <input id="map-search" type="search" placeholder="输入地图名称">
          <label for="map">对战地图</label>
          <select id="map" required><option value="">正在读取地图…</option></select>
          <button id="create" type="submit">创建并进入</button>
          <p id="room-message" role="status"></p>
        </form>
      </section>
      <section class="room-panel" aria-labelledby="rooms-heading">
        <div class="room-heading">
          <h2 id="rooms-heading">联机房间</h2>
          <button id="refresh" class="secondary" type="button">刷新</button>
        </div>
        <div class="room-panel-body">
          <div id="rooms" aria-live="polite">正在读取…</div>
          <p class="hint">对局开始后关闭加入入口。空房间会自动清理。</p>
        </div>
      </section>
    </div>
  </main>
  <dialog id="release-notes" class="release-notes" aria-labelledby="release-notes-heading">
    <header class="room-heading">
      <h2 id="release-notes-heading">更新日志</h2>
      <form method="dialog"><button class="secondary" type="submit" autofocus>关闭</button></form>
    </header>
    <div id="release-notes-content" class="room-panel-body" aria-live="polite"></div>
  </dialog>
</body>
</html>
